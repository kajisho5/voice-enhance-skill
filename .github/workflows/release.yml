name: release

# Runs when a version tag (v*) is pushed (docs/decisions.md ADR-010). The tag is pushed by hand on
# the main commit whose pyproject.toml carries that version; this job checks that the two agree,
# takes the CHANGELOG.md section of that version as the notes and creates the GitHub Release.
# Nothing is published to a package index: this skill is installed from a git checkout.
#
# A tag pushed by a person starts this workflow. A tag pushed with the default GITHUB_TOKEN would
# not (GitHub's anti-recursion rule), so no other workflow here pushes tags.
on:
  push:
    tags: ["v*"]
  # Also runnable by hand on main: it then releases the pyproject.toml version, creating its tag on
  # the dispatched commit when the tag does not exist yet (for a first release cut where a tag
  # cannot be pushed). The checks below are the same either way.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag name reaches the script only through `env:`, never spliced into it with `${{ }}`.
      - name: Check the tag against pyproject.toml and take its CHANGELOG section
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' pyproject.toml | head -n1)"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF_NAME" != "main" ]; then
              echo "::error::run this workflow by hand on main only (got $REF_NAME)"
              exit 1
            fi
            TAG="v$version"
          else
            TAG="$REF_NAME"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if [ -z "$version" ] || [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the pyproject.toml version ($version)"
            exit 1
          fi
          heading="$(grep -m1 -E "^## $(printf '%s' "$version" | sed 's/\./\\./g')( |$)" CHANGELOG.md || true)"
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          if printf '%s' "$heading" | grep -qi 'unreleased'; then
            echo "::error::CHANGELOG.md still calls $version unreleased: date the section before tagging"
            exit 1
          fi
          awk -v h="$heading" '
            $0 == h { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::the CHANGELOG.md section of $version is empty"
            exit 1
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release $TAG already exists: nothing to do."
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            else
              gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            fi
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
